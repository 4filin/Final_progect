---
- name: Configuration server for app
  hosts: all
  become: true

  tasks:
    - name: Install Docker
      dnf:
        name: docker
        state: present
        update_only: no
        
    - name: Start docker 
      systemd:
        name: docker
        enabled: yes 
        state: started 

    - name: Add ec2-user to docker group
      user: 
        name: ec2-user 
        groups: docker
        append: yes

    - name: Ensure docker cli-plugins directory exists
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install docker compose plugin
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"
        force: no

    - name: Install nginx
      dnf:
        name: nginx
        state: present

    - name: Configure nginx as reverse proxy to EKS nodes
      copy:
        dest: /etc/nginx/conf.d/app_proxy.conf
        content: |
          upstream app_backend {
              server 172.31.14.60:30080;
              server 172.31.22.68:30080;
          }
          server {
              listen 80;
              location / {
                  proxy_pass http://app_backend;
                  proxy_set_header Host $host;
              }
          }
      notify: Restart nginx

    - name: Start nginx
      systemd:
        name: nginx
        enabled: yes
        state: started

  handlers:
    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted