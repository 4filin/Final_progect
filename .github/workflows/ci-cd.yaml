name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE_NAME: final-dm-dos35

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -cover

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

  

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push image to ECR
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest

      - name: Get ECR login password
        id: ecrpwd
        run: echo "password=$(aws ecr get-login-password --region us-west-1)" >> "$GITHUB_OUTPUT"

      - name: Get server IP
        id: server
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=final-project-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Copy compose and monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.server.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,monitoring/prometheus.yml"
          target: "~/app"

      - name: Deploy stack with docker compose
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecrpwd.outputs.password }}
        with:
          host: ${{ steps.server.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,ECR_PASSWORD
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$REGISTRY"
            cd ~/app
            docker compose pull
            docker compose up -d
  
 # уведомление (ВСЕГДА) ============
  notify:
    needs: [build-and-test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📦 ${{ github.repository }}
            🔀 Ветка: ${{ github.ref_name }}
            💬 Коммит: ${{ github.event.head_commit.message }}
            🧪 Сборка/тесты: ${{ needs.build-and-test.result }}
            🚀 Деплой: ${{ needs.deploy.result }}
