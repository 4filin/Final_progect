name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE_NAME: final-dm-dos35

jobs:
  # ============ Job 1: сборка и тесты (ВСЕГДА) ============
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        env:
          GOTOOLCHAIN: go1.24.0     # линтер работает на "своей" версии Go
        with:
          version: v1.64.8

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -cover

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

  
    # ============ Job 2: деплой (ТОЛЬКО master) ============
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push image to ECR
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest

      - name: Get ECR login password
        id: ecrpwd
        run: echo "password=$(aws ecr get-login-password --region us-west-1)" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecrpwd.outputs.password }}
        with:
          host: ${{ secrets.APP_SERVER_IP }}
          username: ec2-user  
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: REGISTRY,ECR_PASSWORD
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$REGISTRY/final-dm-dos35:latest"
            docker stop app || true
            docker rm app || true
            docker run -d -p 8080:8080 --name app --restart unless-stopped "$REGISTRY/final-dm-dos35:latest"
  
  # ============ Job 3: уведомление (ВСЕГДА) ============
  notify:
    needs: [build-and-test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📦 ${{ github.repository }}
            🔀 Ветка: ${{ github.ref_name }}
            💬 Коммит: ${{ github.event.head_commit.message }}
            🧪 Сборка/тесты: ${{ needs.build-and-test.result }}
            🚀 Деплой: ${{ needs.deploy.result }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}